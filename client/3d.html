<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10344b"><link rel="icon" type="image/png" href="/assets/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Napoli life"><link rel="apple-touch-icon" href="/assets/icon-512.png"><link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png"><title>Napoli life</title><link rel="stylesheet" href="/ui/style.css"><link rel="stylesheet" href="/ui/hud.css"><link rel="stylesheet" href="/ui/reference-hud.css"><link rel="stylesheet" href="/ui/mobile-hud.css"><link rel="stylesheet" href="/ui/game-settings.css"><link rel="stylesheet" href="/ui/map-legend.css"><link rel="stylesheet" href="/ui/mobile-native-hud.css"><link rel="stylesheet" href="/ui/mobile-reference-hud.css"></head><body>
<section id="rotate-device" role="status" aria-live="polite"><div class="rotate-card"><span class="rotate-icon" aria-hidden="true">↻</span><strong>Ruota il dispositivo</strong><p>Napoli Life mobile si gioca in orizzontale.</p></div></section>
<div id="startup-error" hidden role="alert"><strong>Napoli life non ha caricato tutti i componenti.</strong><p id="startup-error-text"></p><button id="retry-start">Riprova</button></div><noscript>Per aprire Napoli life attiva JavaScript nel browser.</noscript>
<canvas id="world" aria-label="Mondo di Napoli life"></canvas>
<section id="auth" class="veil"><form id="auth-form" class="card welcome"><h1 class="brand logo"><b class="logo-n">NAPOLI</b><b class="logo-l">LIFE</b></h1><small id="ver" style="position:absolute;left:12px;bottom:10px;font-size:11px;color:#9fb4c8"></small><button type="button" id="credits" style="position:absolute;right:10px;bottom:8px;min-height:0;padding:3px 8px;font-size:11px;background:transparent;border:0;color:#9fb4c8;text-decoration:underline">Crediti</button><label id="server-field" hidden>Server Napoli life<input id="server" type="url" inputmode="url" autocomplete="url" placeholder="http://192.168.1.10:3000"></label><label class="fi fi-user"><span>Nome giocatore</span><input name="username" id="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username" placeholder="Il tuo nome nel mondo"></label><label class="fi fi-pass"><span>Password</span><input name="password" type="password" required minlength="6" maxlength="128" autocomplete="current-password" placeholder="La tua password"></label><button class="primary" type="submit">ACCEDI</button><div class="or"><span>oppure</span></div><button type="button" id="register" class="link">Registrati</button><button type="button" id="guest" class="guest">▶ Gioca subito come ospite</button><div id="google-box" hidden><div class="or"><span>oppure</span></div><div id="google-button"></div></div><p id="auth-error" role="alert"></p></form><button id="wifi-share" type="button" aria-label="Mostra il QR per aprire Napoli life sulla rete Wi-Fi di casa">📱 Connetti un dispositivo in Wi-Fi</button></section>
<div id="hud" hidden><header class="identity glass"><canvas id="hud-avatar" class="portrait" width="96" height="96" aria-label="Il tuo avatar"></canvas><div class="id-main"><strong id="my-name"></strong><small id="online-count" class="online-count"></small><div class="level-line"><span id="hud-level">Lv. 1</span><progress id="hud-xp" value="0" max="100" aria-label="Esperienza"></progress></div><div class="wallet"><span class="coin" title="Monete virtuali"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f5b81c" stroke="#a86a06" stroke-width="1.5"/><circle cx="10" cy="10" r="5.6" fill="none" stroke="#ffe27a" stroke-width="1.6"/></svg><b id="hud-coins">—</b></span><span class="gem" title="Gemme virtuali"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10l4 5-9 10L1 8z" fill="#38b6ff" stroke="#0b6fb8" stroke-width="1.2"/><path d="M1 8h18M5 3l5 15 5-15M7 8l3-5 3 5" fill="none" stroke="#bdeaff" stroke-width=".9"/></svg><b id="hud-gems">—</b></span><button id="wallet-plus" aria-label="Come ottenere monete e gemme">+</button></div></div><div id="hud-vip" title="Titolo community sbloccato a 500 XP"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M3 20 1 5l8 6 7-10 7 10 8-6-2 15z" fill="currentColor" stroke="#7a4b00" stroke-width="1.3" stroke-linejoin="round"/><rect x="3" y="20" width="26" height="3" rx="1" fill="currentColor" stroke="#7a4b00" stroke-width="1"/><circle cx="16" cy="13" r="2" fill="#e8344a"/></svg><span>Cittadino</span></div><span id="connection">Connessione…</span><button id="settings" title="Impostazioni" aria-label="Impostazioni">☰</button></header><aside class="map glass"><div class="map-head"><strong id="area">Napoli Centro</strong><span id="world-clock"></span><span id="online">0 online</span></div><div class="map-view"><canvas id="minimap" width="240" height="150"></canvas><button id="map-minus" aria-label="Riduci minimappa">−</button><button id="map-plus" aria-label="Ingrandisci minimappa">+</button></div><button id="map-open" aria-label="Apri mappa grande">Mappa</button></aside>
<nav class="social"><button id="profile">◉<span>Profilo</span></button><button id="friends">♧<span>Amici</span></button><button id="chat-toggle">▤<span>Chat</span></button><button id="voice">♬<span>Voice</span></button></nav>
<div id="toast" role="status"></div><div id="nearby-hint"></div><div id="joystick" aria-label="Joystick analogico a 360 gradi"><div></div></div><div class="actions"><button id="interact" title="Azione contestuale" aria-label="Azione contestuale">✋<span>Azione</span></button><button id="jump" title="Salta" aria-label="Salta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5m0-5 4 4M12 3 8 7M7 11l2 2-1 7m9-9-2 2 1 7M9 13l3 2 3-2M8 21h8"/></svg><span>Salta</span></button><button id="run" type="button" title="Attiva la corsa automatica" aria-label="Attiva la corsa automatica" aria-pressed="false">➜<span>Corri</span></button><button id="inventory" title="Inventario" aria-label="Inventario"><span>Inventario</span></button><button id="phone" title="Telefono Napoli Life" aria-label="Telefono Napoli Life"><span>Telefono</span></button></div>
<section id="chat" class="glass" hidden><div id="messages" aria-live="polite"></div><form id="chat-form"><button type="button" id="chat-mic" aria-label="Attiva o spegni microfono"></button><input id="chat-input" maxlength="300" placeholder="Scrivi un messaggio…" autocomplete="off"><button type="button" id="emote" aria-label="Emoji e gesti">☺</button><button id="chat-send" type="submit" aria-label="Invia messaggio">➤</button></form></section><div id="fps"></div></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Chiudi">×</button></div><div id="modal-body"></div></dialog>
<script>window.HUMANA_3D=true</script><script src="/boot.js"></script><script type="module" src="/loader.js"></script></body></html>
